<head>

<body>
    
    <div class="fp-wrapper">

        </div>

        <form action="">

                <div>

                    <input type="text" class="otp-field" maxlength="1" inputmode="numeric" autocomplete="one-time-code" required />
                    <input type="text" class="otp-field" maxlength="1" inputmode="numeric" required />
                    <input type="text" class="otp-field" maxlength="1" inputmode="numeric" required />
                    <input type="text" class="otp-field" maxlength="1" inputmode="numeric" required />
                    <input type="text" class="otp-field" maxlength="1" inputmode="numeric" required />
                    <input type="text" class="otp-field" maxlength="1" inputmode="numeric" required />

                </div>

                    <p class="down-time">
                        Not yet received yet? Resend in the next <span>30 sec</span>   
                    </p>



            <a href=""> Continue</a>
        </form>
    </div>
