<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft</title>
    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
    <link rel="stylesheet" href="/Craft-style/set-password.css">

    <link rel="icon" type="image/png" href="../images/FAVICON.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <script src="/Craft-script/forget-password.js" defer></script>
</head>
<body>
    
    <div class="fp-wrapper">

        <a href="Craft-signin.css" class="back-btn">
            <i class="hgi hgi-stroke hgi-rounded hgi-arrow-left-01"></i>
        </a>

        <div class="heading-subheading">

            <h3>
                Set Password
            </h3>

            <p>
                Password requires a minimum of 8 characters and contains a mix of letters, numbers, and symbols.
            </p>

        </div>

        <form action="">
                    <div>
                        <label for="password"> Password</label>

                        <div class="input-icon">
                            <input type="password" name="password" placeholder="Enter your Password" id="password" required>

                            <i class="hgi hgi-stroke hgi-rounded hgi-eye"></i>
                        </div>
                    </div>


                    <div>
                        <label for="re-enter-password">Re-enter-Password</label>

                        <div class="input-icon">
                            <input type="password" name="password" placeholder="Enter your Password" id="re-enter-password" required>
                        </div>
                    </div>


            <a href="/Craft-Index/Craft-signin.html"> Continue</a>
        </form>
    </div>
</body>
</html>
