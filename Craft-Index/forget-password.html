        <div class="heading-subheading">

        <form action="">

                    <label for="forget-password-email">
                        Email Address
                    </label>

                    <input type="email" id="forget-password-email" name="email" placeholder="Enter your email Address" required>
            </div>



            <a href=""> Continue</a>
        </form>
