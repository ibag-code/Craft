<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft</title>
    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
    <link rel="stylesheet" href="/Craft-style/Craft-signup.css">

    <link rel="icon" type="image/png" href="images/FAVICON.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <script src="/Craft-script/Craft-signup.js" defer></script>
</head>
<body>
    <div class="main-page">

        <div class="craft-logo">
            <img src="../images/Craft-logo-icon.png" alt="craft-logo" class="main-logo">
            <a href="Craft-website.html"></a>
        </div>


        <div class="welcome-google-divider">

                <h3 class="welcome-txt">Get Started Now!</h3>

                <a href="Google Sign in" class="google-btn"> 
                    <img src="../images/google.png" alt="google-image">
                    Sign Up with Google 
                </a>

                <div class="hr-login-option">
                    <hr> 
                    <div class="divider-txt">Or continue with</div>
                    <hr> 
                
                </div>

                <form id="sign-up-form">

                    <!-- First name and last name -->
                    <div class="input-fl">

                        <div class="input-fl-name">
                            <label for="first-name"> First name</label>
                            <input type="text" name="first name" placeholder="Enter your last name" id="first-name" required>
                        </div>


                        <div class="input-fl-name">
                            <label for="last-name"> Last name</label>
                            <input type="text" name="last name" placeholder="Enter your first name" id="last-name" required>
                        </div>

                    </div>

                    <!-- Email Address -->

                    <div class="input-fl-name">
                            <label for="email">Email Address </label>
                            <input type="text" name="password" placeholder="Enter your email Address" id="email" required>
                    </div>


                    <!-- Password -->
                    <div class="input">
                        <label for="password"> Password</label>

                        <div class="input-icon">
                            <input type="password" name="password" placeholder="Enter your Password" id="password" required class="password">

                            <i class="hgi hgi-stroke hgi-rounded hgi-eye"></i>
                        </div>
                    </div>


                    <div class="input">
                        <label for="re-enter-password">Re-enter-Password</label>

                        <div class="input-icon">
                            <input type="password" name="password" placeholder="Enter your Password" id="re-enter-password" required class="re-password">
                        </div>
                    </div>


                    <button type="submit" class="sign-cta"> Sign in </button>

                </form>

                 <p class="signup">Already have an Account: <a href="Craft-signin.html"> Log in</a></p>


        </div>



    </div>

    <div class="authentication-image">
        <img src="../images/authentication-image.png" alt="" class="authentication-main-image">
    </div>
    
</body>
</html>
