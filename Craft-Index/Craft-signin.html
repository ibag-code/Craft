<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft</title>
    <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
    <link rel="stylesheet" href="/Craft-style/Craft-signin.css">

    <link rel="icon" type="image/png" href="images/FAVICON.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <script src="Craft-signin.js" defer></script>
</head>
<body>
    <div class="form">

        <div class="craft-logo">
            <img src="../images/Craft-logo-icon.png" alt="craft-logo" class="main-logo">
            <a href="Craft-website.html"></a>
        </div>


        <div class="welcome-google-divider">

                <h3 class="welcome-txt">Welcome back!</h3>

                <a href="Google Sign in" class="google-btn"> 
                    <img src="../images/google.png" alt="google-image">
                    Sign in with Google 
                </a>

                <div class="hr-login-option">
                    <hr> 
                    <div class="divider-txt">Or continue with</div>
                    <hr> 
                
                </div>

                <form action="">

                    <!-- <div class="input">
                        <label for="email" class="email-label"> Email Address</label>
                        <input type="text" name="email" placeholder="Enter your email Address" class="email">
                    </div> -->


                    <div class="input">
                        <label for="password"> Email Address</label>

                        <div class="input-icon">
                            <input type="password" name="password" placeholder="Enter your email Address" required>

                            <!-- <i class="hgi hgi-stroke hgi-rounded hgi-eye"></i> -->
                        </div>

                        <!-- <a href="" class="forget-password"> Forget Password</a> -->
                    </div>


                    <div class="input">
                        <label for="password"> Password</label>

                        <div class="input-icon">
                            <input type="password" name="password" placeholder="Enter your Password" required>

                            <i class="hgi hgi-stroke hgi-rounded hgi-eye"></i>
                        </div>

                        <a href="" class="forget-password"> Forget Password</a>
                    </div>


                    <a href="Signin-button" class="sign-cta"> Sign in </a>

                </form>

                 <p class="signup">Are you a new user: <a href="Craft-signup.html">Create a new Account</a></p>


        </div>



    </div>

    <div class="authentication-image">
        <img src="../images/authentication-image.png" alt="" class="authentication-main-image">
    </div>
    
</body>
</html>
